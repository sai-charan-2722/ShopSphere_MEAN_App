<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td style="background:#FF6584;padding:28px 32px;"><h1 style="margin:0;color:#fff;font-size:22px;">ShopSphere Seller</h1></td></tr>
            <tr>
              <td style="padding:32px;">
                <h2 style="margin:0 0 12px;color:#1a1a2e;">You have a new order! 💰</h2>
                <p style="color:#444;font-size:15px;line-height:1.6;">
                  Hi {{name}}, one of your products just sold. Order <strong>#{{orderId}}</strong>
                  totalling <strong>{{total}}</strong> is ready to fulfil.
                </p>
                <p style="color:#888;font-size:13px;margin-top:20px;">
                  Head to your Seller Dashboard to confirm and ship this order.
                </p>
              </td>
            </tr>
            <tr><td style="background:#fafafa;padding:20px 32px;color:#999;font-size:12px;">© ShopSphere</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
