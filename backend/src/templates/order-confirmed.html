<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
      <tr>
        <td align="center">
          <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#6C63FF;padding:28px 32px;">
                <h1 style="margin:0;color:#ffffff;font-size:22px;">ShopSphere</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h2 style="margin:0 0 12px;color:#1a1a2e;">Order Confirmed 🎉</h2>
                <p style="color:#444;font-size:15px;line-height:1.6;">
                  Hi {{name}}, thanks for shopping with us! Your order
                  <strong>#{{orderId}}</strong> has been confirmed and payment received.
                </p>
                <p style="color:#444;font-size:15px;">Total paid: <strong>{{total}}</strong></p>
                <p style="color:#888;font-size:13px;margin-top:24px;">
                  We'll notify you when your items ship. You can track your order in your account.
                </p>
              </td>
            </tr>
            <tr>
              <td style="background:#fafafa;padding:20px 32px;color:#999;font-size:12px;">
                © ShopSphere — Multi-Vendor Marketplace
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
